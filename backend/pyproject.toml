[project]
name = "twitter-analysis"
version = "0.1.0"
description = "Personal X follower tracking dashboard"
authors = [
    { name = "Filippo Mameli" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
